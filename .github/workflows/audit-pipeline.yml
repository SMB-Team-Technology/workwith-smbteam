name: Audit Pipeline (Pass 1 — Research + Seller Review Gate)

on:
  push:
    branches: [main]
    paths:
      - 'triggers/audit-research/*.json'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Find trigger file and parse inputs
        id: inputs
        run: |
          TRIGGER_FILE=$(git diff-tree --no-commit-id -r --name-only "${{ github.sha }}" \
            | grep '^triggers/audit-research/.*\.json$' | head -1)
          echo "trigger_file=$TRIGGER_FILE" >> "$GITHUB_OUTPUT"
          echo "firm_name=$(jq -r '.firm_name' "$TRIGGER_FILE")"   >> "$GITHUB_OUTPUT"
          echo "friendly_name=$(jq -r '.friendly_name' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "sales_rep=$(jq -r '.sales_rep' "$TRIGGER_FILE")"   >> "$GITHUB_OUTPUT"
          echo "date=$(jq -r '.date' "$TRIGGER_FILE")"             >> "$GITHUB_OUTPUT"
          echo "hubspot_contact_id=$(jq -r '.hubspot_contact_id // empty' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "sales_rep_email=$(jq -r '.sales_rep_email // empty' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "suppress_pricing=$(jq -r '.suppress_pricing // "false"' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "package=$(jq -r '.package // empty' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "fathom_url=$(jq -r '.fathom_url // empty' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "has_transcript=$(jq -r 'if ((.transcript // "") | length) > 0 then "true" else "false" end' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve Fathom URL
        id: resolve_fathom
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          FATHOM_URL=$(node scripts/resolve-fathom-url.mjs \
            "${{ steps.inputs.outputs.hubspot_contact_id }}" \
            "${{ steps.inputs.outputs.fathom_url }}" 2>/dev/null || true)
          echo "fathom_url=${FATHOM_URL}" >> "$GITHUB_OUTPUT"
          if [ -n "$FATHOM_URL" ]; then
            echo "Resolved Fathom URL (informational only): $FATHOM_URL"
          else
            echo "No Fathom URL found — the transcript lookup is by invitee email, so Fetch still runs."
          fi

      # The transcript lookup is by invitee email against api.fathom.ai, so it
      # must run even when no fathom.video URL resolved and even when the
      # trigger's transcript field is empty (every Slack-created trigger).
      # The script owns the skip rules: human custody / rep notes and an
      # existing Fathom API transcript are left alone, and HubSpot notes are
      # only used as a fallback after the API came back without a transcript.
      - name: Fetch Fathom transcript
        env:
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          TRIGGER_FILE="${{ steps.inputs.outputs.trigger_file }}"
          node scripts/fetch-pass1-transcript.mjs "$TRIGGER_FILE"

      - name: Pass 1 — Audit Research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TRIGGER_FILE="${{ steps.inputs.outputs.trigger_file }}"
          claude --model claude-sonnet-5 --dangerously-skip-permissions -p "
            You are running Pass 1 of the SMB Team Growth Audit pipeline.

            Read the trigger file at \`$TRIGGER_FILE\` — it is a JSON file containing
            firm_name, friendly_name, url, sales_rep, date, and transcript.
            Extract those values first.

            The trigger file contains a transcript field with the discovery call notes.
            Use that as ground truth per the TRANSCRIPT-FIRST RULE in the command file.
            If transcript_status is present, honor it: outcome "unknown" means the
            Fathom lookup did not finish — do not assert that a discovery call
            happened or did not. outcome "absent" means a complete lookback found
            no call. If custody is "human", the transcript field includes sales-rep
            instructions that must be followed.
            If the URL resolves, browse it live. If not (fictional/test firm), fabricate
            realistic research data for all steps. Do not leave any section blank.

            Read \`.claude/commands/audit-research.md\` in full and execute every step in
            order. Save progress after each major section. Commit the research notes file
            to main and report the commit hash when complete.
          "

      # -----------------------------------------------------------------------
      # Deterministic guard: Pass 1 above can end without actually finishing
      # (e.g. it hits a transient error mid-run — a rate limit, a tool
      # failure — and the process exits having committed nothing) while the
      # step itself still reports success. Everything downstream (package
      # selection, the seller review-gate post) assumes research notes
      # exist, so check that here instead of finding out later when a
      # seller replies to a review request that was never actually ready.
      # -----------------------------------------------------------------------
      - name: Verify Pass 1 completed
        id: verify_pass1
        run: |
          FRIENDLY_NAME="${{ steps.inputs.outputs.friendly_name }}"
          if ls "$FRIENDLY_NAME"/*_Research_Notes.txt >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "No *_Research_Notes.txt found in $FRIENDLY_NAME/ — Pass 1 did not complete."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Pass 1 failure to Slack
        if: steps.verify_pass1.outputs.complete == 'false'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          FIRM_NAME: ${{ steps.inputs.outputs.firm_name }}
          FRIENDLY_NAME: ${{ steps.inputs.outputs.friendly_name }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text    "❌ Research (Pass 1) for *$FIRM_NAME* did not complete — no research notes were produced for \`$FRIENDLY_NAME\`. This proposal has NOT been posted for review. Check the run: $RUN_URL" \
            '{channel: $channel, text: $text}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Pass 1.5 — Deterministic package selection
        if: steps.verify_pass1.outputs.complete == 'true'
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          FRIENDLY_NAME="${{ steps.inputs.outputs.friendly_name }}"
          node scripts/select-package.mjs "$FRIENDLY_NAME" || true

      # -----------------------------------------------------------------------
      # PHASE 1 REVIEW GATE — post the proposal (package, pricing, rationale)
      # to Slack and pause. Pass 2/3 (the actual report build) only fires once
      # the seller replies in-thread with a lock-in. See
      # slack-proposal-response.yml for how that reply is handled.
      # -----------------------------------------------------------------------
      - name: Resolve seller mention
        id: resolve_mention
        if: steps.verify_pass1.outputs.complete == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          MENTION=$(node scripts/resolve-slack-mention.mjs \
            "${{ steps.inputs.outputs.sales_rep }}" \
            "${{ steps.inputs.outputs.sales_rep_email }}")
          echo "mention=$MENTION" >> "$GITHUB_OUTPUT"

      - name: Post proposal to Slack for seller review
        if: steps.verify_pass1.outputs.complete == 'true'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          FIRM_NAME: ${{ steps.inputs.outputs.firm_name }}
          FRIENDLY_NAME: ${{ steps.inputs.outputs.friendly_name }}
          SALES_REP: ${{ steps.inputs.outputs.sales_rep }}
          SALES_REP_EMAIL: ${{ steps.inputs.outputs.sales_rep_email }}
          MENTION: ${{ steps.resolve_mention.outputs.mention }}
          DATE: ${{ steps.inputs.outputs.date }}
          HUBSPOT_CONTACT_ID: ${{ steps.inputs.outputs.hubspot_contact_id }}
          SUPPRESS_PRICING: ${{ steps.inputs.outputs.suppress_pricing }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request, urllib.error, urllib.parse

          token            = os.environ["SLACK_BOT_TOKEN"]
          channel          = os.environ["SLACK_CHANNEL_ID"]
          firm             = os.environ["FIRM_NAME"]
          friendly_name    = os.environ["FRIENDLY_NAME"]
          sales_rep        = os.environ["SALES_REP"]
          sales_rep_email  = os.environ.get("SALES_REP_EMAIL", "").strip()
          mention          = os.environ.get("MENTION") or f"@{sales_rep}"
          date             = os.environ.get("DATE", "")
          hubspot_contact_id = os.environ.get("HUBSPOT_CONTACT_ID", "").strip()
          suppress_pricing = os.environ.get("SUPPRESS_PRICING", "false")

          def slack_api(method, payload):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=body,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Pull the deterministic package decision, if Pass 1.5 produced one.
          decision_path = f"{friendly_name}/package_decision.json"
          lines = [f"📋 *Proposal ready for review: {firm}*", f"Prepared for: {sales_rep} · {date}", ""]

          if os.path.exists(decision_path):
              with open(decision_path) as f:
                  d = json.load(f)
              lines.append(f"*Marketing:* {d.get('marketing_name')} — ${d.get('marketing_price_bundled'):,}/mo")
              if d.get('coaching_name'):
                  lines.append(f"*Coaching:* {d.get('coaching_name')} — ${d.get('coaching_price_bundled'):,}/mo")
              lines.append(f"*Total:* ${d.get('total_bundled'):,}/mo" + (f" (saves ${d.get('total_savings'):,}/mo vs. retail)" if d.get('total_savings') else ""))
              if d.get('ad_spend_conservative'):
                  lines.append(f"*Suggested ad spend:* ${d.get('ad_spend_conservative'):,}–${d.get('ad_spend_aggressive'):,}/mo")
              lines.append(f"*Confidence:* {d.get('confidence')}")
              notes = d.get('selection_notes') or []
              if notes:
                  lines.append("")
                  lines.append("*Why this package:*")
                  for n in notes[:5]:
                      lines.append(f"  • {n}")
          else:
              lines.append("_No deterministic package decision was produced — check the research notes._")

          if suppress_pricing == "true":
              lines.append("")
              lines.append("_Note: this is a consultation-only meeting — pricing sections will be stripped from the final report._")

          lines.append("")
          lines.append(f"{mention} — this is Phase 1 (research + package). Reply in this thread to move it forward:")
          lines.append("  🔒 *lock it in* — build the full proposal deck as-is")
          lines.append("  ❓ *ask why* — e.g. \"why Growth and not Starter?\"")
          lines.append("  ✏️ *propose changes* — e.g. \"swap to Dominate, drop coaching\"")

          text = "\n".join(lines)
          posted = slack_api("chat.postMessage", {"channel": channel, "text": text})
          if not posted.get("ok"):
              raise SystemExit(f"chat.postMessage failed: {posted}")

          review_state = {
              "firm_name": firm,
              "friendly_name": friendly_name,
              "sales_rep": sales_rep,
              "sales_rep_email": sales_rep_email,
              "date": date,
              "hubspot_contact_id": hubspot_contact_id,
              "suppress_pricing": suppress_pricing,
              "slack_channel": posted["channel"],
              "slack_thread_ts": posted["ts"],
              "status": "pending",
          }
          with open(f"{friendly_name}/proposal_review.json", "w") as f:
              json.dump(review_state, f, indent=2)
          print(f"Posted proposal review request to Slack (thread_ts={posted['ts']}).")
          PYEOF

      - name: Commit proposal review state
        if: steps.verify_pass1.outputs.complete == 'true'
        run: |
          FRIENDLY_NAME="${{ steps.inputs.outputs.friendly_name }}"
          if [ -f "$FRIENDLY_NAME/proposal_review.json" ]; then
            git add "$FRIENDLY_NAME/proposal_review.json"
            if [ -f "$FRIENDLY_NAME/package_decision.json" ]; then
              git add "$FRIENDLY_NAME/package_decision.json"
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Phase 1 review gate: awaiting seller response for $FRIENDLY_NAME"
              git push origin main
            fi
          else
            echo "No proposal_review.json produced — Slack post may have failed (see previous step)."
          fi
