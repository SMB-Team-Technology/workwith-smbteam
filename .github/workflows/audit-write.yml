name: Audit Write (Pass 2 + 3, standalone)

on:
  push:
    branches: ['audit-test/control-**']
    paths:
      - 'triggers/audit-write/*.json'

jobs:
  audit-write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python deps for PDF and PPTX generation
        # python-pptx was previously never pinned here — the audit-pptx skill's
        # `claude -p` invocation was installing it ad hoc via its own Bash tool
        # calls, which don't surface in this step's log, making the deck
        # toolchain unreviewed and uncached. Declare it explicitly instead.
        run: pip install reportlab pypdf beautifulsoup4 python-pptx --break-system-packages --quiet

      - name: Find trigger file and parse inputs
        id: inputs
        run: |
          TRIGGER_FILE=$(git diff-tree --no-commit-id -r --name-only "${{ github.sha }}" \
            | grep '^triggers/audit-write/.*\.json$' | head -1)
          echo "trigger_file=$TRIGGER_FILE"                              >> "$GITHUB_OUTPUT"
          echo "firm_name=$(jq -r '.firm_name' "$TRIGGER_FILE")"        >> "$GITHUB_OUTPUT"
          echo "friendly_name=$(jq -r '.friendly_name' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "sales_rep=$(jq -r '.sales_rep' "$TRIGGER_FILE")"        >> "$GITHUB_OUTPUT"
          echo "date=$(jq -r '.date' "$TRIGGER_FILE")"                  >> "$GITHUB_OUTPUT"
          echo "with_pptx=$(jq -r '.with_pptx' "$TRIGGER_FILE")"       >> "$GITHUB_OUTPUT"
          echo "sales_rep_email=$(jq -r '.sales_rep_email // empty' "$TRIGGER_FILE")"     >> "$GITHUB_OUTPUT"
          echo "hubspot_contact_id=$(jq -r '.hubspot_contact_id // empty' "$TRIGGER_FILE")" >> "$GITHUB_OUTPUT"
          echo "suppress_pricing=$(jq -r '.suppress_pricing // "false"' "$TRIGGER_FILE")"  >> "$GITHUB_OUTPUT"
          echo "slack_channel=$(jq -r '.slack_channel // empty' "$TRIGGER_FILE")"          >> "$GITHUB_OUTPUT"
          echo "slack_thread_ts=$(jq -r '.slack_thread_ts // empty' "$TRIGGER_FILE")"      >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Prices in package_decision.json may have been edited by hand or by the
      # Slack bot before the bundle rule existed. Re-price from the catalog
      # (scripts/lib/pricing.mjs) so Pass 2 copies correct numbers.
      - name: Re-price the package before building
        run: |
          FRIENDLY_NAME="${{ steps.inputs.outputs.friendly_name }}"
          DECISION="$FRIENDLY_NAME/package_decision.json"
          if [ ! -f "$DECISION" ]; then
            echo "No package_decision.json — Pass 2 builds from the trigger's package text."
            exit 0
          fi
          node scripts/reprice.mjs "$FRIENDLY_NAME"
          git add "$DECISION"
          if ! git diff --cached --quiet; then
            git commit -m "Re-price package before build: $FRIENDLY_NAME"
            for attempt in 1 2 3; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }}
            done
          fi

      - name: Run audit write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FIRM_NAME="${{ steps.inputs.outputs.firm_name }}"
          FRIENDLY_NAME="${{ steps.inputs.outputs.friendly_name }}"
          SALES_REP="${{ steps.inputs.outputs.sales_rep }}"
          DATE="${{ steps.inputs.outputs.date }}"
          WITH_PPTX="${{ steps.inputs.outputs.with_pptx }}"
          claude --model claude-sonnet-5-5 --dangerously-skip-permissions -p "
            You are running Pass 2 of the SMB Team Growth Audit pipeline.

            Firm Name: $FIRM_NAME
            Friendly Name: $FRIENDLY_NAME
            Sales Rep: $SALES_REP
            Date: $DATE

            Read \`.claude/commands/audit-write.md\` in full. Read the research notes file
            and \`Design Files/audit_styles.css\`. Execute every step in order, saving each
            section before moving to the next. Assemble the final HTML report, generate
            the Sales Companion PDF, and commit everything to the current branch (${{ github.ref_name }}) — CONTROL RUN, never push to main. If with_pptx is
            $WITH_PPTX (true), also run Pass 3. Report the commit hash when done.
          " | tee audit_write_output.log

      - name: Verify audit write completed
        id: verify
        run: |
          FRIENDLY_NAME="${{ steps.inputs.outputs.friendly_name }}"
          WITH_PPTX="${{ steps.inputs.outputs.with_pptx }}"
          MISSING=""

          if [ ! -f "$FRIENDLY_NAME/index.html" ]; then
            MISSING="${MISSING}index.html, "
          fi
          if [ ! -d "$FRIENDLY_NAME/sections" ] || [ -z "$(ls -A "$FRIENDLY_NAME/sections" 2>/dev/null)" ]; then
            MISSING="${MISSING}sections/, "
          fi
          if [ "$WITH_PPTX" = "true" ] && [ -z "$(ls "$FRIENDLY_NAME"/*_Proposal.pptx 2>/dev/null)" ]; then
            MISSING="${MISSING}proposal PPTX, "
          fi

          MISSING="${MISSING%, }"

          if [ -n "$MISSING" ]; then
            echo "write_verified=false" >> "$GITHUB_OUTPUT"
            echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
            echo "::warning::audit-write did not complete for $FRIENDLY_NAME — missing: $MISSING"
          else
            echo "write_verified=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

      - name: CONTROL email (Carolyn only)
        if: steps.verify.outputs.write_verified == 'true'
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIRM_NAME: ${{ steps.inputs.outputs.firm_name }}
          FRIENDLY_NAME: ${{ steps.inputs.outputs.friendly_name }}
        run: |
          python3 - << 'PYEOF'
          import smtplib, os, glob
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication
          u, pw = os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"]
          to = "carolyn.webb@smbteam.com"
          msg = MIMEMultipart()
          msg["From"], msg["To"] = u, to
          msg["Subject"] = f"[TEST — CONTROL, current main pipeline] {os.environ['FIRM_NAME']}"
          msg.attach(MIMEText("Control run of the current (website + PDF) pipeline for the deck regression test. Not sent to anyone else.", "plain"))
          fn = os.environ["FRIENDLY_NAME"]
          for p in glob.glob(f"{fn}/*_Proposal.pptx") + glob.glob(f"{fn}/*_Sales_Companion.pdf"):
              with open(p, "rb") as f:
                  part = MIMEApplication(f.read(), Name=os.path.basename(p))
              part["Content-Disposition"] = f'attachment; filename="{os.path.basename(p)}"'
              msg.attach(part)
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls(); s.login(u, pw); s.sendmail(u, [to], msg.as_string())
          print("Control email sent to", to)
          PYEOF
