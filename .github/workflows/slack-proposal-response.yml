name: Slack Proposal Response (Phase 1 review gate)

on:
  repository_dispatch:
    types: [slack-proposal-response]

jobs:
  handle-response:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -------------------------------------------------------------------
      # Find which firm's Phase 1 review this thread belongs to. Every
      # threaded reply in the Slack channel dispatches here — most are
      # unrelated to a pending proposal review, so bail out quietly (no
      # Slack post, no repo change) unless we find a match.
      # -------------------------------------------------------------------
      - name: Find matching proposal review
        id: find
        env:
          SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
          SELLER_MESSAGE: ${{ github.event.client_payload.instruction }}
        run: |
          MATCH=""
          for f in */proposal_review.json; do
            [ -f "$f" ] || continue
            TS=$(jq -r '.slack_thread_ts // empty' "$f")
            if [ "$TS" = "$SLACK_THREAD_TS" ]; then
              MATCH="$f"
              break
            fi
          done

          if [ -z "$MATCH" ]; then
            echo "No pending proposal review matches thread_ts=$SLACK_THREAD_TS — ignoring."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(jq -r '.status' "$MATCH")
          if [ "$STATUS" != "pending" ]; then
            echo "Matched $MATCH but status is '$STATUS' (not pending) — already handled."
            echo "found=false" >> "$GITHUB_OUTPUT"
            # Don't go silent on a request: tell the seller why nothing happened.
            # Chit-chat ("thanks!") still gets no reply.
            if grep -qiE 'lock|build|change|swap|update|add|remove|drop|price|email|resend|rerun|re-run|firm name|revenue' <<< "$SELLER_MESSAGE"; then
              echo "notify_status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "notify_firm=$(jq -r '.firm_name' "$MATCH")" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Matched $MATCH (status=pending)"
          echo "found=true"                                          >> "$GITHUB_OUTPUT"
          echo "review_file=$MATCH"                                   >> "$GITHUB_OUTPUT"
          echo "friendly_name=$(jq -r '.friendly_name' "$MATCH")"     >> "$GITHUB_OUTPUT"
          echo "firm_name=$(jq -r '.firm_name' "$MATCH")"             >> "$GITHUB_OUTPUT"
          echo "sales_rep=$(jq -r '.sales_rep' "$MATCH")"             >> "$GITHUB_OUTPUT"
          echo "sales_rep_email=$(jq -r '.sales_rep_email // empty' "$MATCH")" >> "$GITHUB_OUTPUT"
          echo "date=$(jq -r '.date' "$MATCH")"                       >> "$GITHUB_OUTPUT"
          echo "hubspot_contact_id=$(jq -r '.hubspot_contact_id // empty' "$MATCH")" >> "$GITHUB_OUTPUT"
          echo "suppress_pricing=$(jq -r '.suppress_pricing // "false"' "$MATCH")"   >> "$GITHUB_OUTPUT"

      - name: Tell the seller this proposal is already past review
        if: steps.find.outputs.notify_status != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
          STATUS: ${{ steps.find.outputs.notify_status }}
          FIRM_NAME: ${{ steps.find.outputs.notify_firm }}
        run: |
          case "$STATUS" in
            locked) WHAT="is locked in and the deck is being built" ;;
            built)  WHAT="has already been built" ;;
            *)      WHAT="is marked '$STATUS'" ;;
          esac
          TEXT="ℹ️ The proposal for *$FIRM_NAME* $WHAT, so I didn't change anything. To change the deck, @mention me in this thread with the edit (e.g. \"@bot change the coaching to Elite Coach\"), or say \"@bot resend the email\" / \"@bot re-run\"."
          PAYLOAD=$(jq -n --arg channel "$SLACK_CHANNEL" --arg thread "$SLACK_THREAD_TS" --arg text "$TEXT" \
            '{channel: $channel, thread_ts: $thread, text: $text}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      # -------------------------------------------------------------------
      # Self-heal: package_decision.json is produced by Pass 1.5 but was
      # historically never committed alongside proposal_review.json, so any
      # proposal still "pending" from before that fix has no decision file
      # on main for this step to read. Regenerate it here rather than
      # failing the whole reply — this also unblocks proposals that got
      # stuck in this state before the commit-step fix landed.
      # -------------------------------------------------------------------
      - name: Ensure package decision exists
        if: steps.find.outputs.found == 'true'
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          FRIENDLY_NAME="${{ steps.find.outputs.friendly_name }}"
          if [ -f "$FRIENDLY_NAME/package_decision.json" ]; then
            echo "package_decision.json already present for $FRIENDLY_NAME."
            exit 0
          fi

          echo "package_decision.json missing for $FRIENDLY_NAME — regenerating."
          node scripts/select-package.mjs "$FRIENDLY_NAME" || true

          if [ -f "$FRIENDLY_NAME/package_decision.json" ]; then
            git add "$FRIENDLY_NAME/package_decision.json"
            if ! git diff --cached --quiet; then
              git commit -m "Pass 1.5 (self-heal): regenerate missing package decision for $FRIENDLY_NAME"
              for attempt in 1 2 3; do
                if git push origin main; then
                  break
                fi
                echo "Push failed (attempt $attempt) — pulling --rebase and retrying."
                git pull --rebase origin main
              done
            fi
          else
            echo "Regeneration did not produce package_decision.json — Phase 1 completeness check will catch this."
          fi

      # -------------------------------------------------------------------
      # Deterministic guard: if Pass 1 (research) never actually completed
      # for this firm — e.g. it hit a transient error mid-run and the
      # process exited without committing research notes — there is nothing
      # for the seller-response handler to build a proposal from. Checking
      # this in bash (rather than leaving it to the agent's judgment in the
      # next step) guarantees the seller always gets a Slack reply instead
      # of the request silently going nowhere.
      # -------------------------------------------------------------------
      - name: Check Phase 1 completeness
        id: phase1
        if: steps.find.outputs.found == 'true'
        run: |
          FRIENDLY_NAME="${{ steps.find.outputs.friendly_name }}"
          TRIGGER_FILE="triggers/audit-research/$FRIENDLY_NAME.json"

          if ! ls "$FRIENDLY_NAME"/*_Research_Notes.txt >/dev/null 2>&1; then
            echo "Research notes missing for $FRIENDLY_NAME."
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # package_decision.json is legitimately absent when the trigger file
          # has an explicit package override — select-package.mjs skips writing
          # it in that case and Pass 2 reads the override directly instead.
          HAS_OVERRIDE="false"
          if [ -f "$TRIGGER_FILE" ] && [ "$(jq -r '.package // empty' "$TRIGGER_FILE")" != "" ]; then
            HAS_OVERRIDE="true"
          fi

          if [ -f "$FRIENDLY_NAME/package_decision.json" ] || [ "$HAS_OVERRIDE" = "true" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_decision.json missing for $FRIENDLY_NAME and no package override set."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Phase 1 incomplete notice to Slack
        if: steps.find.outputs.found == 'true' && steps.phase1.outputs.complete == 'false'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
          FRIENDLY_NAME: ${{ steps.find.outputs.friendly_name }}
          FIRM_NAME: ${{ steps.find.outputs.firm_name }}
        run: |
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg thread  "$SLACK_THREAD_TS" \
            --arg text    "⚠️ Can't process that reply yet — Phase 1 research for *$FIRM_NAME* never actually finished (no research notes or package decision found for \`$FRIENDLY_NAME\`), even though this thread says it's ready for review. Someone needs to re-run the audit-research pipeline for this firm before a reply here can lock in or update the proposal." \
            '{channel: $channel, thread_ts: $thread, text: $text}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Resolve seller mention
        id: resolve_mention
        if: steps.find.outputs.found == 'true' && steps.phase1.outputs.complete == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          MENTION=$(node scripts/resolve-slack-mention.mjs \
            "${{ steps.find.outputs.sales_rep }}" \
            "${{ steps.find.outputs.sales_rep_email }}")
          echo "mention=$MENTION" >> "$GITHUB_OUTPUT"

      - name: Handle the seller's response
        if: steps.find.outputs.found == 'true' && steps.phase1.outputs.complete == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SELLER_MESSAGE: ${{ github.event.client_payload.instruction }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
          FRIENDLY_NAME: ${{ steps.find.outputs.friendly_name }}
          FIRM_NAME: ${{ steps.find.outputs.firm_name }}
          SALES_REP: ${{ steps.find.outputs.sales_rep }}
          SALES_REP_EMAIL: ${{ steps.find.outputs.sales_rep_email }}
          SALES_REP_MENTION: ${{ steps.resolve_mention.outputs.mention }}
          DATE: ${{ steps.find.outputs.date }}
          HUBSPOT_CONTACT_ID: ${{ steps.find.outputs.hubspot_contact_id }}
          SUPPRESS_PRICING: ${{ steps.find.outputs.suppress_pricing }}
          REVIEW_FILE: ${{ steps.find.outputs.review_file }}
        run: |
          printf '%s' "$SELLER_MESSAGE" > /tmp/seller_message.txt

          claude --model claude-sonnet-5-5 --dangerously-skip-permissions -p "
            You are handling a seller's reply to a Phase 1 proposal review request for
            the SMB Team Growth Audit pipeline. The full proposal notes live in
            \`$FRIENDLY_NAME/*Research_Notes.txt\` and \`$FRIENDLY_NAME/package_decision.json\`.
            The seller's reply is in /tmp/seller_message.txt.

            Firm: $FIRM_NAME (friendly name: $FRIENDLY_NAME)
            Sales rep: $SALES_REP <$SALES_REP_EMAIL>
            Slack channel: $SLACK_CHANNEL, thread_ts: $SLACK_THREAD_TS
            Pre-resolved Slack mention for this rep (use this verbatim wherever a reply
            below needs to tag them — do NOT write \"@$SALES_REP\" yourself, that will not
            notify anyone): $SALES_REP_MENTION

            Read the seller's message and classify it into exactly one of the intents below
            (A–E). A message can also carry facts for INTENT E alongside another intent
            (e.g. 'revenue is about 300K, lock it in') — handle E first, then the other.

            PRICES: never type, calculate or edit a price, savings figure or total
            yourself. You choose WHICH products are in the package; then run
            \`node scripts/reprice.mjs $FRIENDLY_NAME\`, which sets every price from the
            catalog in scripts/lib/pricing.mjs and prints a JSON summary (products,
            prices, total, pricing_mode, unpriced_products). Quote prices from that output.
            Bundle rule it applies: bundled prices only when 2+ bundle-eligible products
            are in the package (AI Workforce Pro – Starter never counts); otherwise
            stand-alone prices and no savings. FCOO Partner is retired — never offer it;
            use FCOO Director.

            AWAITING SELLER INPUT: if package_decision.json has \"needs_seller_input\": true,
            no package has been chosen yet (the call focus was unknown, usually because no
            discovery call was found). Treat any reply that says what the call was about or
            names products as INTENT C. Never lock it in while needs_seller_input is true:
            for a lock-in reply, do not write any trigger file or change \`$REVIEW_FILE\`;
            reply in the thread asking what to propose (e.g. 'FCTO Level 1 + 1 seat of
            AIWP', or 'use the revenue-only option').

            LOCK-IN GUARD — check package_decision.json before INTENT A:
            - \"needs_revenue_confirmation\": true → don't lock. Reply in the thread: the
              revenue is unverified (say what it's based on: revenue_label / revenue_source)
              and ask for the firm's actual annual revenue. Exception: the message itself
              gives revenue (handle INTENT E first, then lock), or says 'lock anyway' /
              'lock it in anyway' (lock, and note in the reply that revenue is unverified).
            - non-empty \"unpriced_products\" → don't lock, even with 'anyway'. Reply that
              those products can't be sold on their own yet (no stand-alone price until
              Sales sets one) and ask the seller to add a product or choose another tier.

            --- INTENT A: LOCK IT IN ---
            Signals: 'lock it in', 'looks good', 'approved', 'go ahead', 'build it',
            'let's go', 'ship it', or clear unambiguous approval with no requested changes.
            Steps:
            1. Write \`triggers/audit-write/$FRIENDLY_NAME.json\` with exactly these keys:
               firm_name, friendly_name, sales_rep, sales_rep_email, date, with_pptx (true),
               hubspot_contact_id, slack_channel, slack_thread_ts, suppress_pricing.
               Use the values given above (hubspot_contact_id: \"$HUBSPOT_CONTACT_ID\",
               suppress_pricing: \"$SUPPRESS_PRICING\" — pass suppress_pricing through as the
               literal string \"true\" or \"false\").
            2. git add ONLY that one new file, commit, push to main (pull --rebase first).
               This fires the audit-write.yml pipeline (Pass 2+3, HubSpot writeback, email,
               and the final Slack reply — all handled by that workflow).
            3. Edit \`$REVIEW_FILE\` — set \"status\" to \"locked\". git add, commit
               (separate commit from step 2), push.
            4. Post a Slack reply in the SAME thread confirming the lock-in and that the
               full build is underway (~60-90 min), tagging the rep with the pre-resolved
               mention above:
               curl -s -X POST https://slack.com/api/chat.postMessage \
                 -H \"Authorization: Bearer \$SLACK_BOT_TOKEN\" -H 'Content-Type: application/json' \
                 -d '{\"channel\":\"'\"\$SLACK_CHANNEL\"'\",\"thread_ts\":\"'\"\$SLACK_THREAD_TS\"'\",\"text\":\"'\"\$SALES_REP_MENTION\"' 🔒 Locked in — building the full proposal now (~60-90 min). I will reply here when it is ready.\"}'

            --- INTENT B: ASK FOR RATIONALE ---
            Signals: a question about why something was proposed ('why this tier',
            'why so much ad spend', 'why not X'), with no explicit change requested.
            Steps:
            1. Read the research notes and package_decision.json (especially
               selection_notes) and compose a clear, specific answer grounded in that
               evidence — cite the actual revenue/team-size/practice-area signals used.
            2. Post the answer as a Slack reply in the SAME thread (same curl pattern as
               above, with your answer as the text — keep it under ~150 words).
            3. Do NOT modify \`$REVIEW_FILE\` or any trigger file — status stays 'pending'
               so the seller can still lock it in or propose changes afterward.

            --- INTENT C: PROPOSE CHANGES ---
            Signals: a specific requested change to the package ('swap to X tier',
            'drop coaching', 'raise/lower ad spend', 'use a different price').
            Steps:
            1. Apply the requested change to the PRODUCT fields of
               \`$FRIENDLY_NAME/package_decision.json\` — marketing_name, coaching_name,
               law_name, law_seats, ad_spend_* — and append a note to its selection_notes
               array documenting the seller's override, e.g.
               'Seller override: switched to Dominate tier per Slack request on <date>.'
               Then run \`node scripts/reprice.mjs $FRIENDLY_NAME\` to set the prices.
               - Product names: use the catalog names in scripts/lib/pricing.mjs (e.g.
                 'Full Service Marketing — Starter', 'Paid Ads Starter', 'Web + SEO Growth',
                 'Elite Coach Plus', 'FCOO Director', 'Elite Coach + FCOO Advisor',
                 'Fractional CTO Level 1 + AI Workforce Pro – Starter'). Products outside
                 that file (AI Avatar, Bookkeeping, add-ons, OmniSocial, Attorney Assistant,
                 Foundation Sprint) are priced in \`.claude/commands/audit-write.md\` — look
                 one up there before saying it isn't in the catalog, and never invent a price.
               - Sellers use shorthand. Resolve it before looking up:
                 AIWP (any case, e.g. 'aiwp') / AI Workforce Pro / 'AI software' → AI Workforce Pro – Starter
                 (\$350/user/mo, 1–4 users) or AI Workforce Pro (\$1,597/mo for 5 users +
                 \$120/mo per employee over 5); old names AI Essentials → AI Workforce Pro,
                 AI Accelerator L1/L2 → Fractional CTO Level 1/2, AI Enterprise → Fractional
                 CTO Level 3; 'sprint' / 'foundation sprint' → Law Firm AI Foundation Sprint;
                 FCTO / fractional CTO → Fractional CTO Level 1/2/3; FCOO / fractional COO →
                 FCOO Advisor/Director (Partner is retired — 'max hours' / 'top tier' means
                 Director); FCFO / fractional CFO → FCFO Advisor/Director/Partner;
                 MC → Master's Circle; ECP → Elite Coach Plus.
                 AIWP with no tier: Starter if team_size_effective is 1–4 or team size
                 is unknown (seats = team_size_stated, else 1), base if 5+.
                 If the shorthand maps to one product but its tier or seat count is unclear,
                 apply the most likely tier (team size and revenue in package_decision.json)
                 and say in the reply which tier you used and why, so the seller can correct it —
                 only ask instead of acting if no product matches at all.
               - Whenever you set a package, also set needs_seller_input to false.
                 'Use the revenue-only option' (or 'marketing + coaching', 'the default')
                 means: copy every field in revenue_only_option to the top-level fields of
                 the same name, then run reprice.mjs.
               - 'Change this to X + Y' REPLACES the package: anything not named is removed.
                 Set removed products' name fields to null (for marketing also null
                 marketing_tier and the ad_spend_* fields). Both AI products go in one
                 law_name joined with ' + ', seats in law_seats. reprice.mjs recomputes
                 everything else.
            2. git add ONLY that file, commit, push (pull --rebase first).
            3. Post an updated proposal summary as a Slack reply in the SAME thread,
               in this format, then repeat the same three options as before:
               '$SALES_REP_MENTION 📋 *Updated proposal for $FIRM_NAME*' followed by the new
               marketing/coaching/AI/total lines from the reprice.mjs output (plus ad spend
               from package_decision.json). If pricing_mode is 'standalone', add
               '(stand-alone pricing — fewer than 2 bundle-eligible products)'. If
               unpriced_products is non-empty, say those products can't be sold on their own
               yet and ask for another product or tier. Then:
               'Reply again to: 🔒 lock it in / ❓ ask why / ✏️ propose more changes'
               Use the pre-resolved mention text verbatim (it's already a real Slack
               tag or a visibly-flagged plain name) — do not substitute "@$SALES_REP".
            4. Do NOT modify \`$REVIEW_FILE\` — status stays 'pending' so the loop can
               continue until the seller locks it in.

            --- INTENT D: FIX THE FIRM NAME ---
            Signals: 'firm name is X', 'the firm is called X', 'wrong firm name', 'it's X
            not Y'.
            Steps:
            1. Set \"firm_name\" to the corrected name in \`$REVIEW_FILE\` only, commit,
               push. The lock-in step copies firm_name from that file into the build
               trigger, so the deck uses it. Do NOT edit anything under
               triggers/audit-research/ (any commit there starts a full re-run) and do
               NOT rename the folder or friendly_name.
            2. Reply in the SAME thread: 'Firm name updated to X — the deck will use it.'
            3. Status stays 'pending'.

            --- INTENT E: CONFIRM REVENUE OR TEAM SIZE ---
            Signals: 'revenue is \$300K', 'they do about 1.2M', 'team is 15 people',
            'headcount 7'.
            Steps:
            1. Revenue: run \`node scripts/reprice.mjs $FRIENDLY_NAME --revenue <annual dollars>\`
               (e.g. --revenue 300000). Team size: set team_size_stated and
               team_size_effective in package_decision.json, then run reprice.mjs
               (AIWP seat counts follow team size — update law_seats if AIWP is included).
            2. Check whether the confirmed numbers change the right tier (revenue bands and
               team rules in .claude/commands/audit-write.md, e.g. Master's Circle needs a
               team of 5+, Fractional CTO Level 2 needs \$1M+). If they do, say so in the
               reply and suggest the change — don't swap products unless the seller asked.
            3. Commit package_decision.json, then reply in the SAME thread with what was
               recorded and the current package total.

            RULES FOR ALL INTENTS:
            - Always run 'git pull --rebase origin main' before any git push.
            - If push fails with 403/rejected, pull --rebase and retry up to 3 times.
            - Never touch any other firm's files. This thread belongs to $FIRM_NAME only —
              even if the message names another firm, don't act on that firm; reply that
              changes for another firm go in that firm's own proposal thread.
            - Never guess the seller's intent if genuinely ambiguous — in that case, ask a
              brief clarifying question as a Slack reply in the thread instead of acting,
              and leave $REVIEW_FILE untouched.
          "

      - name: Post error to Slack
        if: failure() && steps.find.outputs.found == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
        run: |
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg thread  "$SLACK_THREAD_TS" \
            '{channel: $channel, thread_ts: $thread, text: "❌ Something went wrong handling that reply. Check the GitHub Actions log for details."}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
