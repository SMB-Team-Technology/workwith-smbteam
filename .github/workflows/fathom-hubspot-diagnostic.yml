name: Fathom-HubSpot Lookup Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test resolve-fathom-url for David Shapiro (contact 227288962849)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          echo "=== Running resolve-fathom-url.mjs (expects share URL) ==="
          FATHOM_URL=$(node scripts/resolve-fathom-url.mjs 227288962849 2>&1)
          echo "URL output: $FATHOM_URL"
          echo ""

          echo "=== Running fetch-hubspot-fathom-notes.mjs (expects full transcript) ==="
          TRANSCRIPT=$(node scripts/fetch-hubspot-fathom-notes.mjs 227288962849 2>&1)
          # Length only: this repo's Actions logs are public.
          echo "Transcript length: ${#TRANSCRIPT}"

      # Logs here are public (public repo): print only status, match method and length.
      - name: Test full-transcript fetch for JCP Lawfirm (status and length only)
        env:
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
        run: |
          OUT="$RUNNER_TEMP/diag_transcript.txt"
          STATUS=$(node scripts/fetch-fathom-transcript.mjs "$OUT" \
            "https://fathom.video/share/GPW1sbdsNc5N7GfyTQcy4BNpn5WHeG2U" \
            "odm@jcplawfirm.com" "jacob.meissner@smbteam.com")
          echo "Result: $STATUS"
          if [ -s "$OUT" ]; then
            echo "Bytes: $(wc -c < "$OUT")"
            echo "Speaker lines: $(grep -c '): ' "$OUT")"
            echo "Lines tagged [SMB Team]: $(grep -c '\[SMB Team\]' "$OUT")"
            echo "Lines tagged [Prospect]: $(grep -c '\[Prospect\]' "$OUT")"
            rm -f "$OUT"
          fi
