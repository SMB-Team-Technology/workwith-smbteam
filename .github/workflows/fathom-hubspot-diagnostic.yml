name: Fathom-HubSpot Lookup Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test resolve-fathom-url for David Shapiro (contact 227288962849)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          echo "=== Running resolve-fathom-url.mjs (expects share URL) ==="
          FATHOM_URL=$(node scripts/resolve-fathom-url.mjs 227288962849 2>&1)
          echo "URL output: $FATHOM_URL"
          echo ""

          echo "=== Running fetch-hubspot-fathom-notes.mjs (expects full transcript) ==="
          TRANSCRIPT=$(node scripts/fetch-hubspot-fathom-notes.mjs 227288962849 2>&1)
          echo "Transcript length: ${#TRANSCRIPT}"
          echo "First 500 chars:"
          echo "$TRANSCRIPT" | head -c 500

      - name: Test FATHOM_API_KEY visibility (which recorders' calls the key can see)
        env:
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
        run: |
          # Prints only counts, dates and recorder names — no titles, invitees or transcript text.
          node --input-type=module -e '
            const key = process.env.FATHOM_API_KEY;
            if (!key) { console.log("FATHOM_API_KEY is not set."); process.exit(0); }
            const after = new Date(Date.now() - 30 * 864e5).toISOString();
            const meetings = [];
            let cursor = null;
            for (let page = 0; page < 10; page++) {
              const url = `https://api.fathom.ai/external/v1/meetings?created_after=${after}${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ""}`;
              const res = await fetch(url, { headers: { "X-Api-Key": key, Accept: "application/json" } });
              console.log(`Page ${page + 1}: HTTP ${res.status}`);
              if (!res.ok) { console.log((await res.text()).slice(0, 300)); break; }
              const data = await res.json();
              meetings.push(...(data.items || []));
              cursor = data.next_cursor || null;
              if (!cursor) break;
            }
            console.log(`\nMeetings visible in last 30 days: ${meetings.length}${cursor ? " (more pages not fetched)" : ""}`);
            const byRecorder = {};
            for (const m of meetings) {
              const who = m.recorded_by?.name || m.recorded_by?.email || "unknown";
              (byRecorder[who] ||= []).push((m.created_at || "").slice(0, 10));
            }
            console.log("\nCalls per recorder:");
            for (const [who, dates] of Object.entries(byRecorder).sort((a, b) => b[1].length - a[1].length)) {
              console.log(`  ${who}: ${dates.length} (latest ${dates.sort().at(-1)})`);
            }
          '
